name: Shared.xcframework for xtool

# Kotlin/Native links Apple targets only on macOS, so a Linux machine building Kimono with
# xtool gets the Compose app from here: run this workflow, then on Linux
#   gh run download --repo kimonoapps/kimono -n Shared.xcframework -D /tmp/kimono-fw
#   apps/compose/iosApp/xtool/prepare.sh /tmp/kimono-fw/Shared.xcframework.zip
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xcframework:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('apps/compose/gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Build Shared.xcframework
        working-directory: apps/compose
        run: |
          ./gradlew :shared:assembleSharedReleaseXCFramework
          cd shared/build/XCFrameworks/release
          # Symlinks inside the framework survive only as a zip (-y), not as loose artifact files.
          zip -qry "$RUNNER_TEMP/Shared.xcframework.zip" Shared.xcframework
      # Pin to a commit SHA, as the release workflow does for its actions.
      - uses: actions/upload-artifact@v4
        with:
          name: Shared.xcframework
          path: ${{ runner.temp }}/Shared.xcframework.zip
          retention-days: 14
